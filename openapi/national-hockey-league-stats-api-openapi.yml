openapi: 3.1.0
info:
  title: NHL Web Game Center Stats API
  description: Unofficial OpenAPI description of the NHL Web API hosted at api-web.nhle.com. This API exposes public read-only endpoints for schedule, scores, standings, rosters, club statistics, player game logs, and game center (boxscore and play-by-play) data. No authentication is required for the documented endpoints; usage should respect NHL terms of service.
  version: 1.0.0
  contact:
    name: API Evangelist
    email: kin@apievangelist.com
servers:
- url: https://api-web.nhle.com
  description: NHL Web API
tags:
- name: Stats
paths:
  /v1/skater-stats-leaders/current:
    get:
      summary: Current skater stats leaders
      operationId: getSkaterStatsLeadersCurrent
      tags:
      - Stats
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /v1/goalie-stats-leaders/current:
    get:
      summary: Current goalie stats leaders
      operationId: getGoalieStatsLeadersCurrent
      tags:
      - Stats
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
