openapi: 3.1.0
info:
  title: NHL Web Game Center Standings API
  description: Unofficial OpenAPI description of the NHL Web API hosted at api-web.nhle.com. This API exposes public read-only endpoints for schedule, scores, standings, rosters, club statistics, player game logs, and game center (boxscore and play-by-play) data. No authentication is required for the documented endpoints; usage should respect NHL terms of service.
  version: 1.0.0
  contact:
    name: API Evangelist
    email: kin@apievangelist.com
servers:
- url: https://api-web.nhle.com
  description: NHL Web API
tags:
- name: Standings
paths:
  /v1/standings/now:
    get:
      summary: Current standings
      description: Returns current league standings.
      operationId: getStandingsNow
      tags:
      - Standings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /v1/standings/{date}:
    get:
      summary: Standings on a date
      operationId: getStandingsByDate
      tags:
      - Standings
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
