- aid: national-hockey-league:nhl-stats-api
  name: NHL Stats API (Legacy)
  description: >-
    Legacy statistics endpoint at api.nhle.com (and the older statsapi.web.nhl.com) used by community
    projects and analytics tools. Hosts deeper historical records, play-by-play, and shift data. Like
    the web API, this surface is undocumented and consumed via reverse-engineered conventions.
  humanURL: https://api.nhle.com/
