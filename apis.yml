- aid: national-hockey-league:nhl-web-api
  name: NHL Web API
  description: >-
    Public but undocumented JSON API that powers NHL.com and the league's first-party web and mobile apps.
    Surfaces schedules, scores, play-by-play, standings, teams, players, draft, prospects, season standings,
    and franchise records. Widely consumed by the hockey-analytics and fan-tools community even though
    the NHL does not publish formal documentation or a rate-limit policy.
  humanURL: https://api-web.nhle.com/
